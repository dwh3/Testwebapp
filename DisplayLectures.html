<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Econometrics lecture materials from David W Hummel III.">
  <title>Lecture Materials | David W Hummel III</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; color: #333; font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    a { color: #245578; }
    a:focus-visible, select:focus-visible { outline: 3px solid #d57700; outline-offset: 3px; }
    header { background: #fff; border-bottom: 1px solid #d9e2e9; padding: 16px 24px; }
    header a { text-decoration: none; font-weight: 600; }
    main { max-width: 1200px; margin: 28px auto; padding: 0 20px 32px; }
    h1 { color: #163d5e; margin: 0 0 8px; line-height: 1.2; }
    .intro { margin: 0 0 24px; }
    .chooser { background: #f1f6fa; border: 1px solid #d5e2ec; padding: 20px; border-radius: 6px; }
    label { display: block; font-weight: 700; color: #163d5e; margin-bottom: 6px; }
    select { width: 100%; max-width: 500px; min-height: 44px; padding: 8px; background: #fff; border: 1px solid #6d8190; border-radius: 4px; font: inherit; }
    .helper { margin: 8px 0 0; font-size: .9rem; }
    .lesson { margin-top: 24px; }
    .lesson h2 { color: #163d5e; margin: 0 0 8px; font-size: 1.3rem; }
    iframe { display: block; width: 100%; height: 75vh; min-height: 500px; border: 1px solid #b9c8d2; background: white; }
    [hidden] { display: none !important; }
    @media(max-width: 600px) { header { padding: 14px 16px; } main { margin-top: 20px; padding: 0 16px 24px; } .chooser { padding: 16px; } iframe { height: 70vh; min-height: 400px; } }
  </style>
</head>
<body>
  <header><a href="./index.html">← Back to David Hummel’s website</a></header>
  <main>
    <h1>Lecture Materials</h1>
    <p class="intro">Explore econometrics and computational statistics lectures.</p>
    <section class="chooser" aria-labelledby="lesson-label">
      <label id="lesson-label" for="lesson">Choose a lecture</label>
      <select id="lesson">
        <option value="">Select a lecture</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/R Basics.html">R Basics</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Functions and Packages.html">Functions and Packages</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Programming and Scripts.html">Programming and Scripts</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/R Vectors and Matrices.html">Vectors and Matrices in R</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Data Manipulation.html">Data Manipulation</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Datasets.html">Datasets</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Graphics.html">Graphics</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Stats Intro - PDFs and CDFs.html">PDFs and CDFs</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Stats Intro - Probability Basics.html">Probability Basics</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Features of Normal Dist-Z Scores.html">Features of Normal Dist-Z Scores</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Key Distributions.html">Key Distributions</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/T Distributions (Small Samples).html">T Distributions (Small Samples)</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Hypothesis Testing.html">Hypothesis Testing</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Sampling - CLT - Confidence Intervals.html">Sampling - CLT - Confidence Intervals</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Simulations.html">Simulations</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Linear Regression and OLS.html">Linear Regression and OLS</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Derivation of OLS.html">Derivation of OLS</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Expectations and OVB.html">Expectations and OVB</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Hypothesis Testing and RSquared.html">Hypothesis Testing and RSquared</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Clean Regression Results.html">Clean Regression Results</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Multicollinearity.html">Multicollinearity</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Violations of Unbiasedness.html">Violations of Unbiasedness</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Categorical Independent Variables.html">Categorical Independent Variables</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Interaction Terms.html">Interaction Terms</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Non-linear Functional Forms.html">Non-linear Functional Forms</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Logistic Regression.html">Logistic Regression</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Lasso and Ridge Regressions.html">Lasso and Ridge Regressions</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Supervised Learning.html">Supervised Learning</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Unsupervised Learning.html">Unsupervised Learning</option>
        <option value="https://dwh3.github.io/Testwebapp/EconometricsLectures/Support Vector Machines.html">Support Vector Machines</option>
      </select>
      <p class="helper">Choose a topic to load its lecture below. You can also open it in a separate tab.</p>
    </section>
    <section id="lecture" class="lesson" hidden aria-labelledby="lecture-heading">
      <h2 id="lecture-heading">Selected lecture</h2>
      <p><a id="open-lecture" target="_blank" rel="noopener noreferrer">Open lecture in a new tab</a></p>
      <iframe id="lecture-frame" title="Selected lecture material"></iframe>
    </section>
  </main>
  <script>
    const selector = document.getElementById('lesson');
    const section = document.getElementById('lecture');
    const frame = document.getElementById('lecture-frame');
    const openLink = document.getElementById('open-lecture');
    const heading = document.getElementById('lecture-heading');
    selector.addEventListener('change', () => {
      const url = selector.value;
      section.hidden = !url;
      if (!url) { frame.removeAttribute('src'); openLink.removeAttribute('href'); return; }
      heading.textContent = selector.options[selector.selectedIndex].text;
      frame.src = url;
      frame.title = heading.textContent + ' lecture material';
      openLink.href = url;
    });
  </script>
</body>
</html>
